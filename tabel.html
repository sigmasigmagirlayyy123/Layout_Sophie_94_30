<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Table HTML dan CSS</title>
        <link rel="stylesheet" href="tabel.css">
    </head>
    <body>
        <h2>Table HTML dan CSS</h2>
        <table>
            <tr>
                <th rowspan="2" class="hover">No.</th>
                <th rowspan="2" class="hover">Nama</th>
                <th rowspan="1" colspan="2" class="hover">Nilai</th>
            </tr>
            <tr>
                <th class="hover">Ulangan 1</th>
                <th class="hover">Ulangan 2</th>
            </tr>
            <tr>
                <td class="hover">1</td>
                <td class="hover">Evie</td>
                <td class="hover">100</td>
                <td class="hover">100</td>
            </tr>
            <tr>
                <td class="hover">2</td>
                <td class="hover">Emillie</td>
                <td class="hover">100</td>
                <td class="hover">100</td>
            </tr>
            <tr>
                <td class="hover">3</td>
                <td class="hover">Michelle</td>
                <td class="hover">100</td>
                <td class="hover">100</td>
            </tr>
            <tr>
                <td class="hover">4</td>
                <td class="hover">Mary</td>
                <td class="hover">100</td>
                <td class="hover">100</td>
            </tr>
            <tr>
                <td class="hover">5</td>
                <td class="hover">Olin</td>
                <td class="hover">100</td>
                <td class="hover">100</td>
            </tr>
            <tr>
                <td class="hover">6</td>
                <td class="hover">Vero</td>
                <td class="hover">100</td>
                <td class="hover">100</td>
            </tr>
        </table>
        <table>
            <tr>
                <th rowspan="3" class="warni">E</th>
                <th rowspan="2" class="warni">J</th>
                <th colspan="2" class="warni">O</th>
                <th rowspan="3" class="warni">M</th>
                <th rowspan="4" class="warni">C</th>
                <th rowspan="2" class="warni">V</th>
                <th rowspan="6" class="warni">H</th>
            </tr>
            <tr>
                <th class="warna">F</th>
                <th class="warna">G</th>
            </tr>
            <tr>
                <th class="warni">I</th>
                <th class="warni">J</th>
                <th class="warni">K</th>
                <th rowspan="2" class="warni">O</th>
            </tr>
            <tr>
                <th colspan="5" class="warna">M</th>
            </tr>
            <tr>
                <th rowspan="2" class="warni">P</th>
                <th colspan="2" class="warni">Q</th>
                <th rowspan="2" class="warni">R</th>
                <th class="warni">U</th>
                <th class="warni">V</th>
                <th class="warni">W</th>
            </tr>
            <tr>
                <th class="warna">S</th>
                <th class="warna">T</th>
                <th class="warna">X</th>
                <th class="warna">Y</th>
                <th class="warna">Z</th>
            </tr>
        </table>
    </body>
</html>
